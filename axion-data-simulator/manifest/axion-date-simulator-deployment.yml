
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-data-simulator
  labels:
    app: axion-data-simulator

spec:
  replicas: 1

  selector:
    matchLabels:
      app: axion-data-simulator

  template:
    metadata:
      labels:
        app: axion-data-simulator

    spec:
      containers:
        - name: axion-data-simulator
          image: acraksdevsecops.azurecr.io/axion-simulator-service:v1
          ports:
            - containerPort: 8080
          env:
            - name: API_URL
              value: "http://axion-ingestion-svc.default.svc.cluster.local:80/api/v1/telemetry/ingest"